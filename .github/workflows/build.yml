name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Build Capacitor App and Icons
      run: |
        npm install -D @capacitor/assets
        mkdir -p assets
        cp icon.png assets/icon.png 2>/dev/null || cp www/icon.png assets/icon.png 2>/dev/null || cp www/6106.jpg assets/icon.png 2>/dev/null || echo "No image found"
        npx cap add android
        npx @capacitor/assets generate --android || true
        npx cap copy android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build APK
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Haneeth-App-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
